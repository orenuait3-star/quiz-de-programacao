    "O que significa a sigla PHP?":"Qual é a expansão histórica do acrônimo PHP?",
    "Java é uma linguagem:":"Em relação ao seu paradigma predominante, Java é uma linguagem:",
    "O que JVM significa?":"Qual é o significado da sigla JVM?",
    "O que Optional ajuda a evitar?":"Qual problema de ausência de valor a classe Optional ajuda a mitigar?",
    "O que uma interface define?":"Em orientação a objetos, qual contrato uma interface define?",
    "O que uma closure com use pode fazer?":"Em uma closure, qual é o efeito da cláusula use?",
    "O que o operador <=> faz?":"Qual é a semântica do operador spaceship (<=>)?",
    "O que uma list comprehension cria?":"Qual estrutura é produzida por uma list comprehension?",
    "O que decoradores fazem?":"Qual é a responsabilidade de um decorador em Python?",
    "O que async def define?":"Qual entidade assíncrona é declarada por async def?",
    "O que @property permite?":"Qual interface de acesso o decorador @property disponibiliza?",
    "O que with geralmente faz?":"Qual é a finalidade da instrução with?",
    "O que std::move faz?":"Qual é a finalidade de std::move na semântica de movimento?",
    "O que RAII associa a recursos?":"No idiom RAII, a que os recursos são vinculados?",
    "O que template permite?":"Qual mecanismo de abstração templates viabiliza em C++?",
    "O que synchronized ajuda a controlar?":"Qual aspecto de concorrência synchronized ajuda a controlar?",
    "O que uma função constexpr pode fazer?":"Em que fase uma função constexpr pode ser avaliada, quando aplicável?",
    "Para que serve const?":"Qual é a finalidade do qualificador const?",
    "Para que serve foreach?":"Qual é a finalidade da iteração foreach?",
    "Para que serve strict_types?":"Qual é a finalidade da diretiva strict_types?",
    "Para que serve o comando include?":"Qual é a responsabilidade da instrução include?",
    "Como uma sessão começa?":"Qual chamada inicializa uma sessão PHP?",
    "Como se declara uma constante?":"Qual é a sintaxe para declarar uma constante?",
    "Como se chama um método estático?":"Qual é a sintaxe de invocação de um método estático?",
    "Como se declara uma classe?":"Qual é a sintaxe para declarar uma classe?",
    "Como se cria uma variável inteira?":"Qual declaração define uma variável do tipo inteiro?",
    "Como se escreve uma string em C++?":"Qual tipo representa uma sequência de caracteres em C++?",
    "Como se escreve um comentário de uma linha?":"Qual token inicia um comentário de linha?",
    "Como se define uma função?":"Qual palavra-chave declara uma função em Python?",
    "Como se importa um módulo?":"Qual instrução carrega um módulo em Python?",
    "Como se cria uma tupla?":"Qual sintaxe literal representa uma tupla?",
    "Como se mostra texto na tela?":"Qual função nativa envia texto para a saída padrão?",
    "Como se cria uma função?":"Qual declaração define uma função em C++?",
    "Como se inicia uma sessão?":"Qual chamada inicializa uma sessão PHP?"
  };
  if(specific[question]) return specific[question];
  return question
    .replace(/^Qual palavra /,"Qual palavra-chave ")
    .replace(/^Qual tipo /,"Qual tipo de dado ")
    .replace(/^Qual símbolo /,"Qual token ")
    .replace(/^Qual comando /,"Qual instrução ")
    .replace(/^Qual função /,"Qual função nativa ")
    .replace(/^Qual biblioteca /,"Qual cabeçalho ou biblioteca ")
    .replace(/^Qual bloco /,"Qual bloco de tratamento ou controle ")
    .replace(/^Qual recurso /,"Qual recurso da linguagem ")
    .replace(/^Qual coleção /,"Qual estrutura de coleção ")
    .replace(/^Qual classe /,"Qual classe da biblioteca padrão ")
    .replace(/^Qual extensão /,"Qual extensão de arquivo ")
    .replace(/^Qual operador /,"Qual operador ")
    .replace(/^Qual método /,"Qual método ")
    .replace(/^Qual interface /,"Qual interface ")
    .replace(/^Qual instrução /,"Qual instrução ")
    .replace(/^Qual diretiva /,"Qual diretiva de pré-processamento ")
    .replace(/^Qual container /,"Qual container da biblioteca padrão ")
    .replace(/^Qual conceito /,"Qual conceito de linguagem ")
    .replace(/^Qual protocolo /,"Qual protocolo de objetos ")
    .replace(/^Qual valor /,"Qual literal ")
    .replace(/^Qual acesso /,"Qual modificador de acesso ")
    .replace(/^Qual superglobal /,"Qual variável superglobal ");
}
function show(screen){screens.forEach(x=>x.classList.remove("active"));screen.classList.add("active")}function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function format(n){return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}
function prepare(){
  // ALTERAÇÃO: preenche o topo da tela com "Linguagem · Dificuldade" (ex.: "Python · Médio").
  // names[language] já existia no código e converte a chave em nome (php -> PHP, cpp -> C++).
  // O objeto {easy, medium, hard} converte a dificuldade escolhida para português.
  // prepare() roda sempre que um quiz começa (depois da contagem regressiva),
  // então o topo mostra a escolha correta a cada partida.
  $("#quiz-tags").textContent=names[language]+" · "+{easy:"Fácil",medium:"Médio",hard:"Difícil"}[difficulty];
  questions=shuffle(banks[language][difficulty].map(x=>({...x,options:shuffle(x.options.map((text,i)=>({text,correct:i===x.answer})))})));$("#progress-bar").innerHTML=questions.map((_,i)=>'<span class="progress-dot" data-i="'+i+'"></span>').join("")}function render(){let x=questions[current];$("#question").textContent=technicalQuestion(x.question);$("#counter").textContent=(current+1)+" de "+questions.length;$("#answers").innerHTML="";x.options.forEach(o=>{let b=document.createElement("button");b.className="answer";b.textContent=o.text;b.dataset.correct=o.correct;b.onclick=()=>answer(o.correct,b);$("#answers").appendChild(b)})}
function answer(correct,button){$("#answers").querySelectorAll("button").forEach(b=>b.disabled=true);let dot=$('[data-i="'+current+'"]');if(correct){score++;button.classList.add("selected-correct");dot.classList.add("correct");dot.textContent="✓"}else{button.classList.add("selected-wrong");$('#answers [data-correct="true"]').classList.add("selected-correct");dot.classList.add("wrong");dot.textContent="✗"}setTimeout(()=>{current++;current<questions.length?render():result()},850)}
function startTimer(){seconds=0;$("#timer").textContent=format(0);clearInterval(timerId);timerId=setInterval(()=>$("#timer").textContent=format(++seconds),1000)}function result(){clearInterval(timerId);$("#score").innerHTML=score+' <span>/ '+questions.length+"</span>";const equivalentScore=(score/questions.length)*15;$("#result-message").textContent=equivalentScore<=3?"Estude mais lil bro.":equivalentScore<=6?"Você estudou, mas não sabe a matéria.":equivalentScore<=9?"Média.":equivalentScore<=12?"Até que bom.":equivalentScore<15?"Quase lá, mas muito bom.":"Total, parabéns!";$(" #result-time".trim()).textContent="Tempo total: "+format(seconds);show($("#result-screen"))}
function countdown(){let n=3;$("#countdown-number").textContent=n;show($("#countdown-screen"));clearInterval(countdownId);countdownId=setInterval(()=>{n--;$("#countdown-number").textContent=n||"Vamos!";if(!n){clearInterval(countdownId);prepare();show($("#quiz-screen"));startTimer();render()}},1000)}
document.querySelectorAll(".language-button").forEach(b=>b.onclick=()=>{language=b.dataset.language;$("#difficulty-title").textContent="Quiz de "+names[language];document.querySelectorAll(".difficulty-button").forEach(x=>x.disabled=false);$("#availability-message").textContent="";show($("#difficulty-screen"))});document.querySelectorAll(".difficulty-button").forEach(b=>b.onclick=()=>{difficulty=b.dataset.difficulty;current=score=0;countdown()});$("#restart-button").onclick=()=>{clearInterval(timerId);clearInterval(countdownId);show($("#home-screen"))};
</script></body></html>
